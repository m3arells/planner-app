
name: Build PLANNER APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          mkdir -p www
          echo "<html><body>PLANNER</body></html>" > www/index.html

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.m3arells.planner",
            "appName": "PLANNER",
            "webDir": "www",
            "server": {
              "url": "https://m3arells.github.io/planner-app/",
              "androidScheme": "https"
            }
          }
          EOF

          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PLANNER-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
